<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ keyword</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/authui.js"></script>
<script src="/static/bao.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><a href="/" style="color:inherit"><b>KW Biến Thể</b></a><span id="crumb">Bộ keyword</span></div>
</header>
<main class="main"><div class="main-inner" id="root">
  <div class="card section"><div class="section-body"><div class="skeleton" style="height:22px;width:40%"></div><div class="skeleton" style="height:14px;width:60%;margin-top:10px"></div></div></div>
</div></main>
<noscript><p>Trang này dựng bằng JavaScript. Agent / công cụ đọc web: đổi /kw-list/&lt;tên bộ&gt; thành /api/lists/&lt;tên bộ&gt;/final.md để đọc bộ keyword final dạng chữ, hoặc /api/lists/&lt;tên bộ&gt;/final.xlsx để tải Excel. Hướng dẫn đầy đủ: <a href="/huong-dan-agent">/huong-dan-agent</a>.</p></noscript>
<div class="chon-bar" id="chon-bar" hidden>
  <span>Đã chọn <b id="chon-so">0</b> keyword</span>
  <button class="btn sm" type="button" id="chon-chep" title="Mỗi dòng: keyword, tab, search volume">Sao chép</button>
  <button class="btn sm danger" type="button" id="chon-xoa" data-cap="kw.edit" data-need="edit">Xoá khỏi bộ</button>
  <button class="btn sm" type="button" id="chon-bo">Bỏ chọn</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("vi-VN");
const KY = {"2025-12": "12/2025", "current": "Kỳ hiện tại"};
const TT = { chua_lay: ["Chưa lấy", ""], cho: ["Chờ extension", "info"], dang_lay: ["Đang lấy", "info"], xong: ["Xong", "ok"], rong: ["Không có dữ liệu", "warn"], loi: ["Lỗi", "bad"] };
const SHEET = { "KW PRODUCT": "Product", "FUNCTION": "Function", "KW GIFTS": "Gift", "PERSONALIZED": "Personalized", "Seasonal": "Occasion" };
const NHAN_CLS = { "Sát": "sat", "Xa": "xa", "Không hợp": "khong" };
const TABS = [["chon", "Chọn cho sản phẩm"], ["so-sanh", "So sánh ASIN"], ["asin", "Từng ASIN"], ["tat-ca", "Tất cả keyword"]];
// Trong "Chọn cho sản phẩm": tab theo loại (Product → Function → Gift → Personalized → Occasion), Tổng hợp ở cuối
const LOAI = [["product", "KW PRODUCT"], ["function", "FUNCTION"], ["gift", "KW GIFTS"], ["personalized", "PERSONALIZED"], ["occasion", "Seasonal"], ["tong-hop", null]];
// Nhóm theo số ASIN có biến thể (≥ 3 ASIN vẫn là Nhóm 1)
const NHOM_ASIN = [[1, "Nhóm 1", "biến thể có ở ≥ 3 ASIN"], [2, "Nhóm 2", "biến thể có ở 2 ASIN"], [3, "Nhóm 3", "biến thể có ở 1 ASIN"], [null, "Không ASIN nào có rank", "khối không có keyword có rank"]];
const MUC = [["Nhóm 1", "biến thể có ở ≥ 3 ASIN"], ["Nhóm 2", "biến thể có ở 2 ASIN"], ["Nhóm 3", "biến thể có ở 1 ASIN"], ["Cần xem xét", "rank tốt nhất > 50"]];
const slug = decodeURIComponent(location.pathname.replace(/^\/kw-list\//, ""));
const PAGE = 300;
let L = null, BT = null, view = { q: "", asin: "", orn: false, sort: "sv", dir: -1, shown: PAGE };
// hash: #chon/<loại> (product … occasion, tong-hop), #so-sanh, #asin-<ASIN>, #tat-ca
let [tab, loaiChon = "product"] = (location.hash.slice(1) || "chon").split("/");
let asinChon = (tab.match(/^asin-(\w+)/) || [])[1] || null;
if (asinChon) tab = "asin";
if (!TABS.some(([k]) => k === tab)) tab = "chon";
if (!LOAI.some(([k]) => k === loaiChon)) loaiChon = "product";
let moHet = false;
let KHOI = [];   // keyword của từng khối đang hiện, để nút "Sao chép" lấy ra (không chép tên biến thể)
const CHON = new Set();   // keyword đang tích chọn (giữ qua các lần vẽ lại)

function toast(m, bad, hanh) {
  const t = $("#toast"); t.textContent = m; t.className = "toast show" + (bad ? " bad" : "");
  if (hanh) {   // nút hành động trong toast (vd Hoàn tác), giữ lâu hơn để kịp bấm
    const b = Object.assign(document.createElement("button"), { type: "button", className: "toast-btn", textContent: hanh.ten });
    b.onclick = () => { t.className = "toast"; hanh.lam(); };
    t.append(" ", b);
  }
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", hanh ? 8000 : 2500);
}

async function load() {
  try {
    // Bộ keyword và phần chia biến thể tải cùng lúc (không đợi nhau), quyền đọc song song
    const [r, bt] = await Promise.all([fetch("/api/lists/" + encodeURIComponent(slug)), layBT()]);
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || "Không đọc được");
    L = d.list; document.title = L.ten; $("#crumb").textContent = L.ten;
    BT = L.rows.length ? bt : null;
    await QUYEN;   // vẽ sau khi biết quyền: vẽ trước thì nút sửa bị mờ oan
    render();
    if (L.trang_thai_asin.some(a => a.trang_thai === "cho" || a.trang_thai === "dang_lay")) setTimeout(load, 5000);
  } catch (e) {
    $("#root").innerHTML = `<div class="card empty"><h3>Không mở được bộ keyword</h3><p>${esc(e.message)}</p><a class="btn" href="/">Về trang chính</a></div>`;
  }
}

// Vẽ lại phần tab mà giữ nguyên khối biến thể đang mở và vị trí cuộn (không có cảm giác tải lại trang)
function veLaiGiu() {
  const mo = new Set([...document.querySelectorAll("#tab-body details[data-k]")].filter(d => d.open).map(d => d.dataset.k));
  const y = window.scrollY;
  renderTab();
  document.querySelectorAll("#tab-body details[data-k]").forEach(d => { if (mo.has(d.dataset.k)) d.open = true; });
  window.scrollTo(0, y);
}

const tomTat = () => `${L.trang_thai_asin.length} ASIN đối thủ · ${fmt(L.stats.goc)} dòng gốc → <b>${fmt(L.stats.gop)}</b> keyword sau gộp (${fmt(L.stats.trung)} dòng trùng)`;

async function taiLai() {   // sau khi xoá / khôi phục: đọc lại bộ + biến thể, chỉ vẽ lại phần tab
  const r = await fetch("/api/lists/" + encodeURIComponent(slug));
  const d = await r.json();
  if (!r.ok || !d.ok) return;
  L = d.list; await loadBT();
  if (!$("#tab-body")) return render();
  $("#tom-tat").innerHTML = tomTat();
  veLaiGiu();
}

// Gỡ ngay các dòng vừa xoá khỏi bảng đang hiện, không đợi server chia lại biến thể
function goDong(kws) {
  const bo = new Set(kws);
  document.querySelectorAll("#tab-body input[data-kw]").forEach(c => { if (bo.has(c.dataset.kw)) c.closest("tr")?.remove(); });
}

async function xoaKw(kws, khoiPhuc) {
  try {
    const r = await fetch(`/api/lists/${encodeURIComponent(slug)}/xoa`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keywords: kws, khoi_phuc: khoiPhuc || false }) });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || "Không lưu được");
    if (!khoiPhuc) { kws.forEach(k => CHON.delete(k)); goDong(kws); capNhatChon(); }
    await taiLai();
    if (khoiPhuc) toast(`Đã khôi phục ${d.doi} keyword`);
    else toast(`Đã xoá ${d.doi} keyword khỏi bộ`, false, { ten: "Hoàn tác", lam: () => xoaKw(kws, true) });
  } catch (e) { toast(e.message, true); }
}

function capNhatChon() {
  const bar = $("#chon-bar");
  $("#chon-so").textContent = fmt(CHON.size);
  bar.hidden = !CHON.size;
  document.querySelectorAll("input[data-ca]").forEach(h => {   // ô tích "cả khối" ở tiêu đề bảng
    const kws = h.dataset.ca === "bang" ? rowsView().slice(0, view.shown).map(r => r.keyword) : KHOI[+h.dataset.ca].kw;
    const n = kws.filter(k => CHON.has(k)).length;
    h.checked = n > 0 && n === kws.length; h.indeterminate = n > 0 && n < kws.length;
  });
}

function ganChon(root) {
  root.querySelectorAll("input[data-kw]").forEach(c => c.addEventListener("change", () => {
    c.checked ? CHON.add(c.dataset.kw) : CHON.delete(c.dataset.kw); capNhatChon();
  }));
  root.querySelectorAll("input[data-ca]").forEach(h => h.addEventListener("change", () => {
    const kws = h.dataset.ca === "bang" ? rowsView().slice(0, view.shown).map(r => r.keyword) : KHOI[+h.dataset.ca].kw;
    kws.forEach(k => h.checked ? CHON.add(k) : CHON.delete(k));
    root.querySelectorAll("input[data-kw]").forEach(c => { c.checked = CHON.has(c.dataset.kw); });
    capNhatChon();
  }));
  capNhatChon();
}

async function layBT() {
  try {
    const r = await fetch(`/api/lists/${encodeURIComponent(slug)}/bien-the`);
    const d = await r.json();
    return r.ok && d.ok ? d : { loi: d.error || "Không chia được biến thể" };
  } catch (e) { return { loi: e.message }; }
}

async function loadBT() { BT = L.rows.length ? await layBT() : null; }

async function datNhan(ten, nhan) {
  try {
    const r = await fetch(`/api/lists/${encodeURIComponent(slug)}/bien-the/nhan`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ten, nhan }) });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || "Không lưu được nhãn");
    BT = d; veLaiGiu(); toast(`Đã đặt "${ten}": ${nhan || "bỏ nhãn"}`);
  } catch (e) { toast(e.message, true); veLaiGiu(); }
}

// ---------------------------------------------------------------- khung trang
function render() {
  const s = L.stats, asins = L.trang_thai_asin;
  $("#root").innerHTML = `
    <div class="page-head" style="align-items:center">
      <img class="thumb" style="width:64px;height:64px" src="/api/products/${encodeURIComponent(L.ma)}/image?cached=1" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb',style:'width:64px;height:64px',textContent:'${esc(L.ma.slice(0,3))}'}))">
      <div style="flex:1;min-width:0">
        <h1>${esc(L.ten)}</h1>
        <div class="sub small" id="tom-tat">${tomTat()}</div>
      </div>
      <a class="btn primary" href="/api/lists/${encodeURIComponent(slug)}/final.xlsx" title="Bộ keyword final: Tổng hợp, mỗi loại một sheet (Product · Function · Gift · Personalized · Occasion), cột Nhóm và Mức sát">Tải Excel final</a>
      <a class="btn" href="/api/lists/${encodeURIComponent(slug)}/export.csv" title="Keyword thô sau gộp, chưa chia biến thể">Tải CSV thô</a>
    </div>

    ${L.ky_tron ? '<div class="note warn" style="margin-bottom:12px">Các ASIN lấy ở kỳ khác nhau (12/2025 và kỳ hiện tại). Search volume giữa hai kỳ không cùng mùa, xem cột Kỳ trước khi so.</div>' : ""}

    <div class="card section"><div class="section-body">
      <div class="table-wrap"><table>
        <thead><tr><th>ASIN</th><th>Trạng thái</th><th>Kỳ dữ liệu</th><th class="num">Keyword</th><th>Nguồn</th><th>Cảnh báo</th></tr></thead>
        <tbody>${asins.map(a => { const [l, c] = TT[a.trang_thai] || [a.trang_thai, ""]; return `<tr>
          <td class="mono"><a href="https://www.amazon.com/dp/${a.asin}" target="_blank" rel="noopener">${a.asin}</a></td>
          <td><span class="badge ${c}">${l}</span></td>
          <td>${a.period_used ? KY[a.period_used] + (a.period_used === "current" ? " (không lọc)" : "") : "—"}</td>
          <td class="num">${a.so_kw ? fmt(a.so_kw) : "—"}</td>
          <td>${a.nguon === "h10" ? (a.dung_lai_tu ? `<span title="Cùng ASIN đã lấy ở bộ ${esc(a.dung_lai_tu)}, không tốn lượt">H10 · dùng lại</span>` : "H10 tự động") : a.nguon === "file" ? "File tải tay" : "—"}</td>
          <td class="small" style="white-space:normal;color:var(--warn)">${a.canh_bao.map(esc).join("; ") || '<span class="muted">—</span>'}</td></tr>`; }).join("")}</tbody>
      </table></div>
    </div></div>

    <div class="card section">
      <div class="section-head" style="flex-wrap:wrap">
        <div class="grow"><h2>Biến thể</h2><p>Rút từ chính dữ liệu từng ASIN (keyword rank 1–100). Nhóm 1: có ở ≥ 3 ASIN, Nhóm 2: 2 ASIN, Nhóm 3: 1 ASIN; rank tốt nhất trên 50 vào Cần xem xét.</p></div>
        <button class="btn sm" id="chep-het" type="button" title="Chép keyword của Nhóm 1–3 trong tab này (không lấy Cần xem xét), mỗi dòng: keyword, tab, search volume (dán vào Excel thành 2 cột), không có tên biến thể">Sao chép tất cả</button>
        <button class="btn sm" id="mo-het" type="button">${moHet ? "Thu hết" : "Mở hết"}</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Các bước chia biến thể">
        ${TABS.map(([k, l]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}
      </div>
      <div class="tab-body" id="tab-body" role="tabpanel"></div>
    </div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; dongBoHash(); render(); });
  $("#mo-het").onclick = () => { moHet = !moHet; render(); };
  $("#chep-het").onclick = () => {
    // So sánh ASIN / Tổng hợp không có khối: chép Nhóm 1–3 của mọi loại theo thứ tự đã xếp (bỏ Cần xem xét, bỏ biến thể bị loại)
    const tatCa = tab === "tat-ca";
    const kw = tatCa ? rowsView().map(r => r.keyword)
      : tab === "so-sanh" || (tab === "chon" && loaiChon === "tong-hop") ? (BT?.chon || []).filter(v => v.muc !== "Cần xem xét").flatMap(v => v.kw.map(r => r.keyword))
      : KHOI.filter(k => k.chinh).flatMap(k => k.kw);
    chep([...new Set(kw)], tatCa ? "keyword đang lọc" : "keyword của các biến thể");
  };
  renderTab();
}

function dongBoHash() {
  history.replaceState(null, "", "#" + (tab === "asin" && asinChon ? "asin-" + asinChon : tab === "chon" ? "chon/" + loaiChon : tab));
}

// Chép mỗi dòng "keyword<tab>search volume" để dán thẳng vào Excel / Sheet thành 2 cột
async function chep(kw, ten) {
  if (!kw.length) return toast("Không có keyword để chép", true);
  const sv = new Map(L.rows.map(r => [r.keyword, r.sv]));
  const text = kw.map(k => `${k}\t${sv.get(k) ?? ""}`).join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch {   // trình duyệt chặn clipboard API: chép bằng ô ẩn
    const t = Object.assign(document.createElement("textarea"), { value: text, style: "position:fixed;opacity:0" });
    document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  toast(`Đã chép ${kw.length} ${ten}`);
}

function renderTab() {
  const el = $("#tab-body");
  KHOI = [];
  if (tab === "tat-ca") return renderTatCa(el);
  if (!L.rows.length) { el.innerHTML = `<div class="empty"><h3>Chưa có keyword</h3><p>Chờ extension lấy Cerebro, hoặc tải file tay ở trang chính.</p></div>`; return; }
  if (!BT || BT.loi) { el.innerHTML = `<div class="note bad">${esc(BT?.loi || "Chưa chia được biến thể")}</div>`; return; }
  if (tab === "chon") renderChon(el);
  else if (tab === "so-sanh") renderSoSanh(el);
  else renderTungAsin(el);
  ganChon(el);
  el.querySelectorAll("[data-chep]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();   // không gập/mở khối
    const k = KHOI[+b.dataset.chep];
    chep(k.kw, `keyword của "${k.ten}"`);
  }));
  el.querySelectorAll("[data-loai]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();   // không gập/mở khối
    datNhan(b.dataset.loai, b.dataset.nhan);
  }));
  AUTHUI.apply(el);
}

// ---------------------------------------------------------------- khối biến thể
// Cột sóng mức sát: 5 vạch, xanh lá dài nhất = sát nhất → đỏ ngắn nhất = không hợp (server tính theo số ASIN × rank tốt nhất)
function song(v) {
  const ten = BT.ten_sat?.[v.sat] || "";
  const ly = `${v.so_asin}/${BT.NA} ASIN · rank tốt nhất ${v.rank ?? "—"}`;
  return `<span class="song s${v.sat}" role="img" aria-label="Mức sát ${v.sat}/5: ${ten} (${ly})" title="Mức sát ${v.sat}/5 · ${ten}\n${ly}"><i></i><i></i><i></i><i></i><i></i><span class="song-ten">${ten}</span></span>`;
}

// Loại tay biến thể không hợp sản phẩm (vd thương hiệu); "Đưa lại" bỏ nhãn
function nutLoai(ten, nhan) {
  const da = nhan === "Không hợp";
  return `<button type="button" class="btn sm ${da ? "" : "ghost"}" data-loai="${esc(ten)}" data-nhan="${da ? "" : "Không hợp"}" data-cap="kw.edit" data-need="edit"
    title="${da ? "Đưa biến thể trở lại danh sách" : "Loại biến thể này khỏi danh sách (không hợp sản phẩm)"}">${da ? "Đưa lại" : "Loại"}</button>`;
}

const oChon = k => `<td class="ck"><input type="checkbox" data-kw="${esc(k)}" ${CHON.has(k) ? "checked" : ""} aria-label="Chọn ${esc(k)}"></td>`;

function bangKw(kw, i) {
  return `<div class="table-wrap"><table>
    <thead><tr><th class="ck"><input type="checkbox" data-ca="${i}" aria-label="Chọn cả khối"></th><th>Keyword</th><th class="num">Search volume</th><th class="num">Trend</th><th class="num">Organic rank</th><th>ASIN nguồn</th><th class="num">Số ASIN có</th><th>Kỳ</th><th>Lý do loại</th></tr></thead>
    <tbody>${kw.map(r => `<tr>${oChon(r.keyword)}<td class="kw">${esc(r.keyword)}</td><td class="num">${fmt(r.sv)}</td><td class="num">${r.trend == null ? "—" : r.trend + "%"}</td>
      <td class="num">${fmt(r.rank)}</td><td class="mono">${r.asin}</td><td class="num">${r.so_asin}/${BT.NA}</td><td>${KY[r.ky] || "—"}</td>
      <td class="small" style="white-space:normal">${esc((r.neg || []).join("; "))}</td></tr>`).join("")}</tbody></table></div>`;
}

// Dòng đầu khối: "tên biến thể + loại (SV: …; … keyword)", dòng dưới: "x/3 ASIN - rank tốt nhất …"
function khoi({ ten, tag, nhan, kw, cls, chinh = true, soAsin, rank, nhom, v }) {
  const i = KHOI.push({ ten, kw: kw.map(r => r.keyword), chinh }) - 1;
  const sv = kw.reduce((n, r) => n + (r.sv || 0), 0);
  const duoi = [soAsin != null ? `${soAsin}/${BT.NA} ASIN` + (nhom ? ` (Nhóm ${nhom})` : "") : "", rank != null ? `rank tốt nhất ${rank}` : ""].filter(Boolean).join(" - ");
  return `<details class="vb ${cls || ""}" data-k="${esc((cls || "") + "|" + (tag || "") + "|" + ten)}" ${moHet ? "open" : ""}>
    <summary>
      <span class="vt"><span class="caret" aria-hidden="true"></span><span class="ten">${esc(ten)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}<span class="sl">(SV: ${fmt(sv)}; ${kw.length} keyword)</span></span>
      <span class="vm">${v ? song(v) : ""}${nhan !== undefined ? nutLoai(ten, nhan) : ""}<button type="button" class="btn sm" data-chep="${i}" title="Chép ${kw.length} keyword, mỗi dòng: keyword, tab, search volume" ${kw.length ? "" : "disabled"}>Sao chép</button></span>
      ${duoi ? `<span class="vr">${duoi}</span>` : ""}
    </summary>
    ${kw.length ? bangKw(kw, i) : '<div class="small muted" style="padding:10px 12px">Không có keyword.</div>'}
  </details>`;
}

const nhomSub = (ten, mo, vs) => `<div class="nhom-sub">${esc(ten)} <span class="mo">· ${esc(mo)} · ${vs.length} biến thể · SV ${fmt(vs.reduce((n, v) => n + v.sv, 0))}</span></div>`;
const nhomHead = (ten, mo, vs) => `<div class="nhom-head">${esc(ten)} <span class="mo">· ${esc(mo)} · ${vs.length} biến thể · SV ${fmt(vs.reduce((n, v) => n + v.sv, 0))}</span></div>`;

// Một tab loại: Nhóm 1 → 2 → 3 → Cần xem xét → bị loại → khối phụ (chưa phân loại, negative)
function renderLoai(el, sheet) {
  const chon = BT.chon.filter(v => v.sheet === sheet), loai = BT.loai.filter(v => v.sheet === sheet), phu = BT.phu?.[sheet] || [];
  const ghi = { "FUNCTION": " Mục này gom keyword có decor / decoration / decorations (không có ornament), chia biến thể như Product.",
    "KW GIFTS": " Keyword có từ chỉ người nhận (women, men, mom, dad, kids, horse lover…) chia theo đối tượng trước, còn lại theo chủ đề.",
    "PERSONALIZED": " Mục này gom keyword có personalized / personalize / personalise / custom / customized…" }[sheet] || "";
  let html = `<p class="small muted" style="margin:0 0 12px">Trong mỗi nhóm, biến thể nhiều ASIN đối thủ dùng chung đứng trước, cùng số ASIN thì rank tốt nhất nhỏ hơn đứng trước. Keyword trong khối xếp theo Search Volume. Cột sóng là mức sát tự tính (xanh lá = sát, đỏ = không hợp); bấm “Loại” để bỏ biến thể không hợp sản phẩm.${ghi}</p>`;
  for (const [m, mo] of MUC) {
    const vs = chon.filter(v => v.muc === m);
    if (!vs.length) continue;
    html += nhomHead(m, mo, vs);
    const xem = m === "Cần xem xét";
    const ve = v => khoi({ ten: v.ten, tag: SHEET[sheet] + (v.doi_tuong ? " · đối tượng" : ""), nhan: v.nhan, kw: v.kw, v, chinh: !xem, cls: xem ? "xem" : "",
      soAsin: v.so_asin, rank: v.rank });
    if (!xem) { for (const v of vs) html += ve(v); continue; }
    // Cần xem xét cũng chia theo số ASIN có biến thể: Nhóm 1 → 2 → 3
    for (const [n, ten, mo2] of NHOM_ASIN) {
      const con = vs.filter(v => v.nhom === n);
      if (con.length) html += nhomSub(ten, mo2, con) + con.map(ve).join("");
    }
  }
  if (loai.length) {
    html += nhomHead("Loại: không sát sản phẩm", "nhãn Không hợp", loai);
    for (const v of loai) html += khoi({ ten: v.ten, tag: SHEET[sheet] + (v.doi_tuong ? " · đối tượng" : ""), nhan: v.nhan, kw: v.kw, v, cls: "loai", chinh: false, soAsin: v.so_asin, rank: v.rank });
  }
  if (phu.length) {
    html += `<div class="nhom-head">Chưa vào biến thể</div>`;
    for (const p of phu) html += khoi({ ten: p.ten, kw: p.kw, cls: "phu", chinh: false });
  }
  if (!chon.length && !loai.length && !phu.length) html += `<div class="empty"><h3>Không có keyword ${SHEET[sheet]}</h3><p>${sheet === "PERSONALIZED" ? "Không ASIN nào có keyword personalized / custom trong bộ lọc." : "Không có keyword nào thuộc loại này trong bộ lọc."}</p></div>`;
  el.innerHTML = html;
}

// Chọn cho sản phẩm: hàng tab theo loại, bên dưới là nội dung loại đang chọn (hoặc Tổng hợp)
function renderChon(el) {
  el.innerHTML = `<div class="tabs sub" role="tablist" aria-label="Loại keyword">
      ${LOAI.map(([k, sh]) => `<button role="tab" type="button" data-loai-tab="${k}" aria-selected="${loaiChon === k}">${sh ? SHEET[sh] : "Tổng hợp"}${sh ? `<span class="so">${BT.chon.filter(v => v.sheet === sh).length}</span>` : ""}</button>`).join("")}
    </div><div id="loai-body" role="tabpanel"></div>`;
  const sh = LOAI.find(([k]) => k === loaiChon)[1];
  sh ? renderLoai($("#loai-body"), sh) : renderTongHop($("#loai-body"));
  el.querySelectorAll("[data-loai-tab]").forEach(b => b.onclick = () => { loaiChon = b.dataset.loaiTab; dongBoHash(); renderTab(); });
}

// So sánh ASIN: mỗi loại chia Nhóm 1 / 2 / 3 theo số ASIN có biến thể; trong nhóm xếp rank tốt nhất nhỏ trước
function renderSoSanh(el) {
  const bang = ds => `<div class="table-wrap" style="margin-bottom:8px"><table>
      <thead><tr><th>Biến thể</th><th class="num">ASIN dùng</th><th class="num">Rank tốt nhất</th>${BT.asins.map(a => `<th class="num">Rank ${a}<div class="small muted" style="font-weight:400">${KY[BT.ky[a]] || ""}</div></th>`).join("")}
        <th class="num">Tổng SV</th><th class="num">Số kw</th><th>Bậc lọc</th><th>Mức sát</th><th></th><th>Root (kw rank tốt nhất)</th></tr></thead>
      <tbody>${ds.map(v => `<tr${v.nhan === "Không hợp" ? ' class="muted"' : ""}><td><b>${esc(v.ten)}</b>${v.muc === "Cần xem xét" ? ' <span class="tag">rank &gt; 50</span>' : ""}</td><td class="num">${v.so_asin}/${BT.NA}</td><td class="num">${v.rank ?? "—"}</td>
        ${BT.asins.map(a => `<td class="num">${v.per[a] == null ? '<span class="muted">—</span>' : v.per[a]}</td>`).join("")}
        <td class="num">${fmt(v.sv)}</td><td class="num">${v.so_kw}</td><td>${v.bac}</td><td>${song(v)}</td><td>${nutLoai(v.ten, v.nhan)}</td><td class="kw">${esc(v.root || "—")}</td></tr>`).join("")}</tbody>
    </table></div>`;
  el.innerHTML = Object.entries(BT.so_sanh).map(([sheet, ds]) => `
    <div class="nhom-head">${SHEET[sheet]} <span class="mo">· ${ds.length} ${sheet === "Seasonal" ? "khối" : "biến thể"}</span></div>
    ${ds.length ? NHOM_ASIN.map(([n, ten, mo]) => { const con = ds.filter(v => v.nhom === n); return con.length ? nhomSub(ten, mo, con) + bang(con) : ""; }).join("")
      : '<p class="small muted">Không có biến thể.</p>'}`).join("");
}

// Tổng hợp: bảng đếm loại × nhóm, cách tính mức sát, rồi toàn bộ biến thể (mọi loại) với rank ở từng ASIN

function renderTongHop(el) {
  const tatCa = [...BT.chon, ...BT.loai];
  const root = {};
  for (const [sh, ds] of Object.entries(BT.so_sanh)) for (const v of ds) root[sh + "|" + v.ten] = v.root;
  const o = (vs) => vs.length ? `${vs.length} <span class="muted">· SV ${fmt(vs.reduce((n, v) => n + v.sv, 0))}</span>` : '<span class="muted">—</span>';
  const cot = [...MUC.map(([m]) => m), "Loại"];
  const dem = sh => cot.map(m => m === "Loại" ? BT.loai.filter(v => v.sheet === sh) : BT.chon.filter(v => v.sheet === sh && v.muc === m));
  const tong = cot.map(m => m === "Loại" ? BT.loai : BT.chon.filter(v => v.muc === m));
  el.innerHTML = `
    <div class="table-wrap" style="margin-bottom:14px"><table>
      <thead><tr><th>Loại</th>${cot.map(m => `<th class="num">${m}</th>`).join("")}<th class="num">Chưa vào biến thể</th></tr></thead>
      <tbody>${LOAI.filter(([, sh]) => sh).map(([k, sh]) => `<tr><td><a href="#chon/${k}" data-tab-link="${k}">${SHEET[sh]}</a></td>${dem(sh).map(vs => `<td class="num">${o(vs)}</td>`).join("")}
        <td class="num">${fmt((BT.phu?.[sh] || []).reduce((n, p) => n + p.kw.length, 0))} kw</td></tr>`).join("")}
        <tr><td><b>Tổng</b></td>${tong.map(vs => `<td class="num"><b>${o(vs)}</b></td>`).join("")}<td class="num"><b>${fmt(Object.values(BT.phu || {}).flat().reduce((n, p) => n + p.kw.length, 0))} kw</b></td></tr></tbody>
    </table></div>
    <details class="vb phu" data-k="cach-tinh" style="margin-bottom:14px"><summary><span class="vt"><span class="caret" aria-hidden="true"></span><span class="ten">Cách tính mức sát</span></span></summary>
      <div class="table-wrap"><table>
        <thead><tr><th>Số ASIN có biến thể</th><th>Rank tốt nhất ≤ 20</th><th>21–50 (page 1)</th><th>51–75</th><th>76–100</th></tr></thead>
        <tbody>${[[3, "≥ 3 ASIN", [5, 4, 2, 1]], [2, "2 ASIN", [4, 3, 2, 1]], [1, "1 ASIN", [3, 3, 1, 1]]].map(([, l, ds]) => `<tr><td>${l}</td>${ds.map(m => `<td>${song({ sat: m, so_asin: "", rank: "" }).replace(/ title="[^"]*"/, "")}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div></details>
    <div class="table-wrap"><table>
      <thead><tr><th>Loại</th><th>Nhóm</th><th>Biến thể</th><th class="num">ASIN dùng</th><th class="num">Rank tốt nhất</th>${BT.asins.map(a => `<th class="num">Rank ${a}<div class="small muted" style="font-weight:400">${KY[BT.ky[a]] || ""}</div></th>`).join("")}
        <th class="num">Tổng SV</th><th class="num">Số kw</th><th>Mức sát</th><th></th><th>Root (kw rank tốt nhất)</th></tr></thead>
      <tbody>${tatCa.map(v => `<tr${v.nhan === "Không hợp" ? ' class="muted"' : ""}><td>${SHEET[v.sheet]}</td><td>${v.muc}</td><td><b>${esc(v.ten)}</b>${v.doi_tuong ? ' <span class="tag">đối tượng</span>' : ""}</td><td class="num">${v.so_asin}/${BT.NA}</td><td class="num">${v.rank ?? "—"}</td>
        ${BT.asins.map(a => `<td class="num">${v.per[a] == null ? '<span class="muted">—</span>' : v.per[a]}</td>`).join("")}
        <td class="num">${fmt(v.sv)}</td><td class="num">${v.so_kw}</td><td>${song(v)}</td><td>${nutLoai(v.ten, v.nhan)}</td><td class="kw">${esc(root[v.sheet + "|" + v.ten] || "—")}</td></tr>`).join("")}</tbody>
    </table></div>`;
  el.querySelectorAll("[data-tab-link]").forEach(a => a.onclick = e => { e.preventDefault(); loaiChon = a.dataset.tabLink; dongBoHash(); renderTab(); });
}

function renderTungAsin(el) {
  const ds = BT.tung_asin;
  if (!asinChon || !ds.some(t => t.asin === asinChon)) asinChon = ds[0]?.asin;
  const t = ds.find(x => x.asin === asinChon);
  el.innerHTML = `<div class="seg" role="group" aria-label="Chọn ASIN">${ds.map(x => `<button type="button" data-asin="${x.asin}" aria-pressed="${x.asin === asinChon}">${x.asin} · ${KY[x.ky] || x.ky}</button>`).join("")}</div>
    <p class="small muted" style="margin:0 0 12px">Biến thể của riêng ASIN này: rút từ kw rank 1–100 của chính ASIN; rank tốt nhất là rank của kw biến thể trong ASIN này; kw của ASIN gom vào biến thể theo rule, xếp theo Search Volume.</p>
    ${Object.entries(t.bien_the).map(([sheet, vs]) => `<div class="nhom-head">${SHEET[sheet]}: ${vs.filter(v => !v.phu).length} ${sheet === "FUNCTION" || sheet === "Seasonal" ? "khối" : "biến thể"}</div>` +
      (vs.length ? vs.map(v => khoi({ ten: v.ten, tag: v.phu ? "" : SHEET[sheet], kw: v.kw, cls: v.phu ? "phu" : "", chinh: !v.phu, rank: v.rank }))
        .join("") : '<p class="small muted">Không có.</p>')).join("")}`;
  el.querySelectorAll("[data-asin]").forEach(b => b.onclick = () => { asinChon = b.dataset.asin; dongBoHash(); renderTab(); });
}

// ---------------------------------------------------------------- tất cả keyword (bảng gộp)
function rowsView() {
  const q = view.q.toLowerCase();
  let rs = L.rows.filter(r => (!q || r.keyword.toLowerCase().includes(q)) && (!view.asin || r.cac_asin.includes(view.asin)) && (!view.orn || /\bornaments?\b/i.test(r.keyword)));
  const k = view.sort, d = view.dir;
  rs.sort((a, b) => {
    const x = a[k], y = b[k];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * d;
  });
  return rs;
}

function renderTatCa(el) {
  el.innerHTML = `
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <input class="input" id="f-q" type="search" placeholder="Lọc keyword" style="width:200px" aria-label="Lọc keyword" value="${esc(view.q)}">
      <select class="input" id="f-asin" style="width:auto" aria-label="Lọc theo ASIN"><option value="">Mọi ASIN</option>${L.trang_thai_asin.map(a => `<option ${view.asin === a.asin ? "selected" : ""}>${a.asin}</option>`).join("")}</select>
      <label class="row small"><input type="checkbox" id="f-orn" ${view.orn ? "checked" : ""}> Chỉ keyword có "ornament"</label>
      <span class="small muted">Mỗi keyword giữ dòng có organic rank tốt nhất; hoà rank thì lấy search volume cao hơn.</span>
    </div>
    ${(L.da_xoa || []).length ? `<details class="vb phu" data-k="da-xoa" style="margin-bottom:10px"><summary><span class="vt"><span class="caret" aria-hidden="true"></span><span class="ten">Đã xoá ${L.da_xoa.length} keyword khỏi bộ</span></span>
      <span class="vm"><button type="button" class="btn sm" id="khoi-phuc-het" data-cap="kw.edit" data-need="edit">Khôi phục tất cả</button></span></summary>
      <div class="small" style="padding:10px 12px;white-space:normal">${L.da_xoa.map(esc).join(" · ")}</div></details>` : ""}
    <div id="tbl"></div>`;
  const kp = $("#khoi-phuc-het");
  if (kp) kp.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); xoaKw([], "het"); });
  $("#f-q").addEventListener("input", e => { view.q = e.target.value; view.shown = PAGE; renderTable(); });
  $("#f-asin").addEventListener("change", e => { view.asin = e.target.value; view.shown = PAGE; renderTable(); });
  $("#f-orn").addEventListener("change", e => { view.orn = e.target.checked; view.shown = PAGE; renderTable(); });
  renderTable();
}

function renderTable() {
  if (!L.rows.length) {
    $("#tbl").innerHTML = '<div class="empty"><h3>Chưa có keyword</h3><p>Chờ extension lấy Cerebro, hoặc tải file tay ở trang chính.</p><a class="btn" href="/#' + encodeURIComponent(L.ma) + '">Về trang chính</a></div>';
    return;
  }
  const rs = rowsView();
  const th = (k, l, num) => `<th class="sort ${num ? "num" : ""}" data-k="${k}" aria-sort="${view.sort === k ? (view.dir > 0 ? "ascending" : "descending") : "none"}">${l}${view.sort === k ? (view.dir > 0 ? " ↑" : " ↓") : ""}</th>`;
  $("#tbl").innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th class="ck"><input type="checkbox" data-ca="bang" aria-label="Chọn các keyword đang hiện"></th>${th("keyword", "Keyword")}${th("sv", "Search volume", 1)}${th("trend", "Trend", 1)}${th("rank", "Organic rank", 1)}<th>ASIN nguồn</th>${th("so_asin", "Số ASIN có", 1)}<th>Kỳ</th></tr></thead>
      <tbody>${rs.slice(0, view.shown).map(r => `<tr>${oChon(r.keyword)}
        <td class="kw">${esc(r.keyword)}</td><td class="num">${fmt(r.sv)}</td><td class="num">${r.trend == null ? "—" : r.trend + "%"}</td>
        <td class="num">${fmt(r.rank)}</td><td class="mono">${r.asin}</td><td class="num">${r.so_asin}/${L.asins.length}</td><td>${KY[r.ky] || "—"}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="row" style="justify-content:space-between;padding:10px 0 0">
      <span class="small muted">Hiện ${fmt(Math.min(view.shown, rs.length))} / ${fmt(rs.length)} keyword</span>
      ${rs.length > view.shown ? '<button class="btn sm" id="more">Hiện thêm</button>' : ""}
    </div>`;
  $("#tbl").querySelectorAll("th.sort").forEach(h => h.onclick = () => {
    const k = h.dataset.k; view.dir = view.sort === k ? -view.dir : (k === "keyword" || k === "rank" ? 1 : -1); view.sort = k; renderTable();
  });
  const m = $("#more"); if (m) m.onclick = () => { view.shown += PAGE; renderTable(); };
  ganChon($("#tbl"));
  AUTHUI.apply($("#root"));
}

$("#chon-chep").onclick = () => chep([...CHON], "keyword đã chọn");
$("#chon-bo").onclick = () => { CHON.clear(); document.querySelectorAll("input[data-kw]").forEach(c => { c.checked = false; }); capNhatChon(); };
$("#chon-xoa").onclick = () => xoaKw([...CHON]);

// Đọc quyền song song với dữ liệu; load() đợi QUYEN xong mới vẽ (vẽ trước thì nút sửa bị mờ oan)
const QUYEN = AUTHUI.boot().catch(() => {});
load();
</script>

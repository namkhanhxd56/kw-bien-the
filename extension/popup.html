<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>KW Biến Thể – Cerebro</title>
<style>
  :root {
    --bg: #ffffff; --surface-2: #f1f3f6; --ink: #16191f; --ink-2: #4a5160; --muted: #7a8290;
    --line: #e3e6eb; --line-2: #d3d8df; --primary: #1d2330; --accent: #2f6fde;
    --ok: #1f8a4c; --warn: #a86a00; --warn-soft: #fdf3e0; --bad: #c2362f; --bad-soft: #fbeaea;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header b { font-size: 14px; }
  header .ver { margin-left: auto; color: var(--muted); font-size: 12px; }
  section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .line { display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .line .k { color: var(--ink-2); width: 112px; flex: none; }
  .line .v { min-width: 0; overflow-wrap: anywhere; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); } .dot.warn { background: var(--warn); }
  .note { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note:empty { display: none; }
  label.f { display: block; margin-bottom: 8px; }
  label.f span { display: block; color: var(--ink-2); margin-bottom: 3px; }
  input[type=text], input[type=password], input[type=number] { width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 6px; font: inherit; color: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .switch { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .switch input { margin: 3px 0 0; }
  .switch small { display: block; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header><b>KW Biến Thể – Cerebro</b><span class="ver" id="ver"></span></header>

<section aria-labelledby="h-tt">
  <h2 id="h-tt">Trạng thái</h2>
  <div class="line"><span class="dot" id="d-tool"></span><span class="k">Tool</span><span class="v" id="v-tool">…</span></div>
  <div class="line"><span class="dot" id="d-h10"></span><span class="k">Helium 10</span><span class="v" id="v-h10">…</span></div>
  <div class="line"><span class="dot" id="d-adapter"></span><span class="k">Bộ lấy Cerebro</span><span class="v" id="v-adapter">…</span></div>
  <div class="line"><span class="dot" id="d-job"></span><span class="k">Việc</span><span class="v" id="v-job">…</span></div>
  <div class="line"><span class="dot" style="visibility:hidden"></span><span class="k">Lần cuối</span><span class="v" id="v-last">—</span></div>
  <div class="note bad" id="loi" role="alert"></div>
  <div class="row" style="margin-top:10px">
    <button id="b-tick">Kiểm tra ngay</button>
    <button id="b-open">Mở Cerebro</button>
  </div>
</section>

<section aria-labelledby="h-chay">
  <h2 id="h-chay">Chạy</h2>
  <label class="switch"><input type="checkbox" id="c-running"><span>Nhận job từ tool<small>Mỗi lần 1 ASIN, chạy trong tab H10 nền.</small></span></label>
  <label class="switch"><input type="checkbox" id="c-capture"><span>Soi Cerebro (ghi lại thao tác tay)<small>Bật lên rồi làm tay 1 lượt Cerebro: extension ghi nút bạn bấm và dữ liệu trang nhận về, gửi lên tool. Không dùng API của H10. Đã gửi: <b id="v-cap">0</b></small></span></label>
</section>

<section aria-labelledby="h-kn">
  <h2 id="h-kn">Kết nối tool</h2>
  <form id="f">
    <label class="f"><span>Địa chỉ tool</span><input type="text" id="i-server" class="mono" spellcheck="false" required></label>
    <label class="f"><span>Agent token (để trống nếu tool chạy ở máy này)</span><input type="password" id="i-token" class="mono" autocomplete="off"></label>
    <label class="f"><span>Nghỉ giữa các job (giây)</span><input type="number" id="i-nghi" min="5" max="300" step="1"></label>
    <div class="row"><button class="primary" type="submit">Lưu kết nối</button><span class="muted" id="saved" role="status" style="align-self:center"></span></div>
  </form>
</section>

<script src="popup.js"></script>
</body>
</html>
